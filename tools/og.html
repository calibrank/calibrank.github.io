<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Social preview card</title>
<!-- Renders assets/img/og.png (1200 x 630): open with a local server and screenshot,
     e.g. google-chrome --headless=new --window-size=1200,630 --screenshot=og.png http://127.0.0.1:8765/tools/og.html -->
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fcfcfb; }
  .card { position: relative; width: 1200px; height: 630px; box-sizing: border-box; padding: 64px 64px 56px; display: grid;
    grid-template-columns: 560px 1fr; gap: 40px; }
  .k { font-family: var(--font-sans); font-size: 17px; letter-spacing: .07em; text-transform: uppercase; color: #52514e; }
  h1 { font-family: var(--font-serif); font-size: 60px; line-height: 1.02; letter-spacing: -0.025em; font-weight: 650; margin: 20px 0 18px; color: #0b0b0b; }
  .sub { font-family: var(--font-serif); font-size: 23px; line-height: 1.35; color: #52514e; margin: 0; }
  .who { position: absolute; left: 64px; bottom: 56px; font-family: var(--font-sans); font-size: 19px; color: #0b0b0b; }
  .who span { color: #52514e; }
  .bars { position: absolute; left: 64px; top: 0; display: flex; gap: 6px; }
  .bars i { display: block; width: 46px; height: 8px; border-radius: 0 0 4px 4px; }
  #plot { align-self: center; }
  #plot text { font-family: var(--font-sans); }
</style>
</head>
<body>
<div class="card">
  <div class="bars"><i style="background:#2a78d6"></i><i style="background:#eb6834"></i><i style="background:#1baf7a"></i><i style="background:#eda100"></i><i style="background:#e87ba4"></i><i style="background:#008300"></i></div>
  <div>
    <div class="k">Informatics 13(11), 201 · 2026</div>
    <h1>When Calibration Data Become Training&nbsp;Data</h1>
    <p class="sub">Specialization and self-generated text in learned low&#8209;rank compression of large language models</p>
  </div>
  <div id="plot"></div>
  <div class="who">Van Tien Pham <span>· calibrank.github.io</span></div>
</div>
<script src="../assets/js/lib/d3/d3.min.js"></script>
<script type="module">
  import { SOURCES, SRC, srcColor, symbolPath, symbolRotate } from "../assets/js/viz.js";
  const P = await (await fetch("../data/paper.json")).json();
  const pts = P.hero.map(([m, r, seed, s, iw, ic, fw, fc]) => ({ m, r, seed, s, fw, fc }));
  const key = (d) => `${d.m}|${d.r}|${d.seed}`;
  const best = d3.rollup(pts, (v) => ({ w: d3.min(v, (d) => d.fw), c: d3.min(v, (d) => d.fc) }), key);
  pts.forEach((d) => { const b = best.get(key(d)); d.x = d.fc / b.c; d.y = d.fw / b.w; });
  const W = 500, H = 440, m = { l: 44, r: 10, t: 10, b: 40 };
  const svg = d3.select("#plot").append("svg").attr("width", W).attr("height", H);
  const x = d3.scaleLog().domain([0.93, d3.max(pts, (d) => d.x) * 1.15]).range([m.l, W - m.r]);
  const y = d3.scaleLog().domain([0.93, d3.max(pts, (d) => d.y) * 1.15]).range([H - m.b, m.t]);
  svg.append("rect").attr("x", m.l).attr("y", m.t).attr("width", W - m.l - m.r).attr("height", H - m.t - m.b).attr("rx", 10).attr("fill", "#f5f4f0");
  svg.append("line").attr("x1", m.l).attr("x2", W - m.r).attr("y1", y(1)).attr("y2", y(1)).attr("stroke", "#6f6e69").attr("stroke-width", 1.3);
  svg.append("line").attr("x1", x(1)).attr("x2", x(1)).attr("y1", m.t).attr("y2", H - m.b).attr("stroke", "#6f6e69").attr("stroke-width", 1.3);
  svg.selectAll("path").data(pts).join("path").attr("d", (d) => symbolPath(d.s, 70))
    .attr("transform", (d) => `translate(${x(d.x)},${y(d.y)}) rotate(${symbolRotate(d.s)})`)
    .attr("fill", (d) => srcColor(d.s)).attr("stroke", "#f5f4f0").attr("stroke-width", 1.4);
  svg.append("text").attr("x", W - m.r - 8).attr("y", y(1) - 10).attr("text-anchor", "end").attr("font-size", 15).attr("fill", "#0b0b0b")
    .text("every WikiText-2 model: best on WikiText-2");
  svg.append("text").attr("x", x(1) + 10).attr("y", m.t + 22).attr("font-size", 15).attr("fill", "#0b0b0b").text("every C4 model: best on C4");
  svg.append("text").attr("x", W - m.r).attr("y", H - 12).attr("text-anchor", "end").attr("font-size", 14).attr("fill", "#52514e")
    .text("C4 perplexity ÷ best source →");
  svg.append("text").attr("transform", `translate(16,${m.t}) rotate(-90)`).attr("text-anchor", "end").attr("font-size", 14).attr("fill", "#52514e")
    .text("WikiText-2 perplexity ÷ best source →");
  document.body.dataset.ready = "1";
</script>
</body>
</html>
